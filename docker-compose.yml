services:
  app:
    build: .
    image: ai-video-prep-studio:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aivps
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-set-SECRET_KEY-env-var}
      - URL_EXTRA_ALLOWED_NETWORKS=${URL_EXTRA_ALLOWED_NETWORKS:-[]}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./data}/uploads:/app/uploads
      - ${DATA_DIR:-./data}/outputs:/app/outputs

  worker:
    # same image as app — built once (two parallel builds re-downloaded ~2 GB of CUDA wheels)
    image: ai-video-prep-studio:latest
    pull_policy: never
    command: rq worker default
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aivps
      - REDIS_URL=redis://redis:6379/0
      - RQ_REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-set-SECRET_KEY-env-var}
      - URL_EXTRA_ALLOWED_NETWORKS=${URL_EXTRA_ALLOWED_NETWORKS:-[]}
      - HF_HOME=/hf-cache
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./data}/uploads:/app/uploads
      - ${DATA_DIR:-./data}/outputs:/app/outputs
      - ${HF_CACHE_DIR:-./data/hf-cache}:/hf-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # postgres / redis are reachable only inside the compose network (no host ports)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aivps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
